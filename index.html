<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwydion Books | Independent Press</title>
    <style>
        body {
            font-family: "Garamond", "Baskerville", "Times New Roman", serif;
            background-color: #f7f9fa;
            color: #333333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            line-height: 1.6;
        }
        .container {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .logo {
            max-width: 100px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            font-family: "Garamond", "Baskerville", "Times New Roman", serif;
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #2c3e50;
            margin: 0 0 30px 0;
        }
        .book-cover {
            max-width: 520px; /* Doubled from original 260px */
            width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }
        p {
            font-family: "Garamond", "Baskerville", "Times New Roman", serif;
            font-size: 1.2rem;
            margin-bottom: 35px;
            color: #444;
            max-width: 500px;
        }
        .btn {
            display: inline-block;
            background-color: #2c3e50;
            color: white;
            padding: 14px 35px;
            font-family: "Garamond", "Baskerville", "Times New Roman", serif;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: background 0.2s ease;
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.2);
        }
        .btn:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Logo at the top middle -->
        <img src="gwydionlogo.png" alt="Gwydion Books Logo" class="logo">
        
        <!-- 2. Main Title in Garamond Bold All Caps -->
        <h1>Gwydion Books</h1>
        
        <!-- 3. Book Cover Image (Doubled in size) -->
        <img src="cover.jpg" alt="Book Cover" class="book-cover">
        
        <!-- 4. Blurb in Garamond Regular -->
        <p>A small, voluntary-run independent press based in Britain, we champion imaginative stories that refuse to stay in one genre. Drawn to the surreal, the darkly humorous and the unexpected, we publish work that sheds fresh light on contemporary life.</p>
        
        <!-- 5. Coming Soon Button in Garamond Bold -->
        <div>
            <!-- Replace '#' with your actual Amazon link when ready -->
            <a href="#" target="_blank" class="btn">Coming Soon</a>
        </div>
    </div>

</body>
</html>
