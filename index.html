<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwydion Books | Independent Press</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #2c3e50;
            --bg-color: #f7f9fa;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            background: #ffffff;
            max-width: 850px;
            width: 90%;
            margin: 20px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        @media (min-width: 700px) {
            .container {
                flex-direction: row;
                text-align: left;
                padding: 50px;
                gap: 40px;
                align-items: flex-start;
            }
        }
        .book-cover {
            max-width: 260px;
            width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            margin-bottom: 25px;
        }
        @media (min-width: 700px) {
            .book-cover {
                margin-bottom: 0;
                flex-shrink: 0;
            }
        }
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 15px;
        }
        @media (min-width: 700px) {
            .logo {
                margin-left: 0;
            }
        }
        h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin: 0 0 20px 0;
        }
        p {
            margin-bottom: 25px;
            color: #444;
            font-size: 1.05rem;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 30px;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            transition: background 0.2s ease;
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.2);
            text-align: center;
            width: fit-content;
        }
        .btn:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Book Cover Image (Positioned to the left on desktop) -->
        <img src="cover.jpg" alt="Book Cover" class="book-cover">
        
        <div class="content">
            <!-- Logo Above the Title -->
            <img src="gwydionlogo.png" alt="Gwydion Books Logo" class="logo">
            
            <!-- Main Title -->
            <h1>Gwydion Books</h1>
            
            <!-- Blurb -->
            <p>A small, voluntary-run independent press based in Britain, we champion imaginative stories that refuse to stay in one genre. Drawn to the surreal, the darkly humorous and the unexpected, we publish work that sheds fresh light on contemporary life.</p>
            
            <!-- Coming Soon Button / Amazon Link -->
            <div>
                <!-- Replace '#' with your actual Amazon link when ready -->
                <a href="#" target="_blank" class="btn">Coming Soon</a>
            </div>
        </div>
    </div>

</body>
</html>
