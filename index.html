<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Book Title | Official Author Page</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --bg-color: #f9f9f9;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            background: #ffffff;
            max-width: 800px;
            width: 90%;
            margin: 20px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        @media (min-width: 650px) {
            .container {
                flex-direction: row;
                text-align: left;
                padding: 50px;
                gap: 40px;
            }
        }
        .book-cover {
            max-width: 260px;
            width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        @media (min-width: 650px) {
            .book-cover {
                margin-bottom: 0;
            }
        }
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
            font-style: italic;
        }
        p {
            margin-bottom: 25px;
            color: #555;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: background 0.2s ease;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }
        .btn:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replace 'cover.jpg' with the actual filename of your book cover image -->
        <img src="cover.jpg" alt="Book Cover" class="book-cover">
        
        <div class="content">
            <h1>Your Book Title</h1>
            <div class="subtitle">By Your Author Name</div>
            <p>Write a short, gripping synopsis or description of your book here. Hook your readers, give them a hint of the journey inside, and make them eager to turn the page.</p>
            
            <div>
                <!-- Replace '#' with your actual Amazon link -->
                <a href="#" target="_blank" class="btn">Buy on Amazon</a>
            </div>
        </div>
    </div>

</body>
</html>
